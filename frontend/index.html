<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cineuphoria | Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <section class="auth-card" aria-labelledby="title">
      <p class="eyebrow">Cineuphoria</p>
      <h1 id="title">Tu próxima función empieza aquí</h1>
      <p class="intro">Inicia sesión para continuar con la compra de tus entradas.</p>
      <form id="login-form" novalidate>
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
        <button type="submit">Iniciar sesión</button>
      </form>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
      <section id="session" class="session hidden" aria-live="polite">
        <h2 id="welcome"></h2>
        <p>Tu sesión está activa. Ya puedes continuar con la selección de película y funciones.</p>
        <button id="logout" class="secondary" type="button">Cerrar sesión</button>
      </section>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
